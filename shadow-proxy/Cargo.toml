[package]
name = "shadow-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
tokio = { version = "1.45.1", features = ["full"] }
# rustls instead of the default system OpenSSL, so binaries don't depend on its version
reqwest = { version = "0.12.19", default-features = false, features = [
    "charset",
    "http2",
    "system-proxy",
    "rustls-tls-native-roots",
] }
serde_json = "1.0.140"
dotenvy = "0.15.7"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
