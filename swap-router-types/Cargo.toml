[package]
name = "swap-router-types"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
bigdecimal = "0.4.8"
num-traits = "0.2.19"
sha2 = "0.10.9"
borsh = { version = "1.6.0", features = ["derive"] }
near-min-api = { git = "https://github.com/INTEARnear/wallet" }
intear-dex-types = { git = "https://github.com/INTEARnear/dex", rev = "1fb8f1479f6a3fe9e39517d1a0c5cbf6c60ea230" }
otc-dex-types = { git = "https://github.com/INTEARnear/dex", rev = "1fb8f1479f6a3fe9e39517d1a0c5cbf6c60ea230" }
# Native builds of the dex's types crates need this feature
near-sdk = { version = "5.29", default-features = false, features = ["non-contract-usage"] }

[features]
# For usage in hooks
hook = []
