[package]
name = "qoq-hook"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
# Loaded by the aggregator as hooks/Qoq.so
name = "qoq"
crate-type = ["cdylib"]

[dependencies]
swap-router-types = { path = "../swap-router-types", features = ["hook"] }
pathfinder = { path = "../pathfinder", default-features = false }
near-min-api = { git = "https://github.com/INTEARnear/wallet" }
intear-dex-common = { git = "https://github.com/INTEARnear/dex", rev = "d598675001f6e794ba9d29a4a8bb936aecf151e0" }
amp-dex-types = { git = "https://github.com/INTEARnear/dex", rev = "d598675001f6e794ba9d29a4a8bb936aecf151e0" }
# Native builds of the dex's types crates need this feature
near-sdk = { version = "5.30", default-features = false, features = ["non-contract-usage"] }
borsh = "1.6.0"
bigdecimal = "0.4.8"
serde = { version = "1.0.219", features = ["derive"] }
reqwest = { version = "0.12.19", features = ["json"] }
tokio = { version = "1.45.1", features = ["rt", "time"] }
futures-util = "0.3.31"
anyhow = "1"
