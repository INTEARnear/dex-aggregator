[package]
name = "plach-hook"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
# Loaded by the aggregator as hooks/Plach.so
name = "plach"
crate-type = ["cdylib"]

[dependencies]
swap-router-types = { path = "../swap-router-types", features = ["hook"] }
pathfinder = { path = "../pathfinder", default-features = false }
near-min-api = { git = "https://github.com/INTEARnear/wallet" }
intear-dex-common = { git = "https://github.com/INTEARnear/dex" }
xyk-dex-types = { git = "https://github.com/INTEARnear/dex" }
# Native builds of the dex's types crates need this feature
near-sdk = { version = "5.30", default-features = false, features = ["non-contract-usage"] }
borsh = "1.6.0"
bigdecimal = "0.4.8"
anyhow = "1"

[dev-dependencies]
sha2 = "0.10.9"
tokio = { version = "1.45.1", features = ["sync"] }
