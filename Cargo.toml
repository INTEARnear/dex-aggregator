[package]
name = "swap-router"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
axum = { version = "0.8.4", features = ["ws", "http2"] }
tokio = { version = "1.45.1", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_urlencoded = "0.7.1"
dotenvy = "0.15.7"
chrono = { version = "0.4.41", features = ["serde"] }
near-min-api = { git = "https://github.com/INTEARnear/wallet" }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
lazy_static = "1.5.0"
reqwest = { version = "0.12.19", features = ["json", "gzip"] }
futures-util = "0.3.31"
tower-http = { version = "0.6.2", features = ["cors"] }
cached = { version = "0.55.1", features = ["async"] }
bigdecimal = "0.4.8"
num-traits = "0.2.19"
borsh = "1.6.0"
sha2 = "0.10.9"
base64 = "0.21.0"
ipnet = { version = "2.12.2", features = ["serde"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate", "chrono"] }
pathfinder = { path = "pathfinder" }
intear-dex-types = { git = "https://github.com/INTEARnear/dex", rev = "25c30dfe89a2b7e79ef29162f67ee070a7a47704", features = ["json"] }
xyk-dex-types = { git = "https://github.com/INTEARnear/dex", rev = "25c30dfe89a2b7e79ef29162f67ee070a7a47704" }
# Native builds of the dex's types crates need this feature
near-sdk = { version = "5.29", default-features = false, features = ["non-contract-usage"] }

[profile.release]
overflow-checks = true

[workspace]
members = ["pathfinder", "pool-indexer", "shadow-proxy"]
